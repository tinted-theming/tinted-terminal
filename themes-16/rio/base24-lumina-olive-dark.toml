# Rio Terminal base24 color theme (https://github.com/tinted-theming)
# Color scheme: Lumina Olive Dark by Razik Ikhlef (https://github.com/RazikSF)

[colors]
selection-background = '#dfddce' # base05
selection-foreground = '#30321d' # base02

cursor         = '#dfddce' # base05
tabs           = '#262814' # base01
