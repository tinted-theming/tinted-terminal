# Rio Terminal base24 color theme (https://github.com/tinted-theming)
# Color scheme: Lumina Canopy Dark by Razik Ikhlef (https://github.com/RazikSF)

[colors]
selection-background = '#cddbd0' # base05
selection-foreground = '#202c24' # base02

cursor         = '#cddbd0' # base05
tabs           = '#17221a' # base01
tabs-active    = '#202c24' # base02

background     = '#131d16' # base00
foreground     = '#cddbd0' # base05
black          = '#131d16' # base00
red            = '#d3665e' # base08
yellow         = '#f2bb31' # base0A
green          = '#96d4a2' # base0B
cyan           = '#8ce3dd' # base0C
blue           = '#8dc6ff' # base0D
magenta        = '#c1b8fc' # base0E
white          = '#cddbd0' # base05

dim-foreground   = '#cddbd0' # base05
dim-black        = '#17221a' # base01
dim-red          = '#d3665e' # base08
dim-yellow       = '#f2bb31' # base0A
dim-green        = '#96d4a2' # base0B
dim-cyan         = '#8ce3dd' # base0C
dim-blue         = '#8dc6ff' # base0D
dim-magenta      = '#c1b8fc' # base0E
dim-white        = '#617064' # base04

light-foreground = '#cddbd0' # base05
light-black      = '#2a362d' # base03
light-red        = '#df8981' # base12
light-yellow     = '#ffd989' # base13
light-green      = '#aeefbb' # base14
light-cyan       = '#a1fbf5' # base15
light-blue       = '#bedeff' # base16
light-magenta    = '#f2b9f5' # base17
light-white      = '#cddbd0' # base07
