# Rio Terminal base24 color theme (https://github.com/tinted-theming)
# Color scheme: Lumina Nebula Dark by Razik Ikhlef (https://github.com/RazikSF)

[colors]
selection-background = '#cadceb' # base05
selection-foreground = '#171f29' # base02

cursor         = '#cadceb' # base05
tabs           = '#0e1520' # base01
