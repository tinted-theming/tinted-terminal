dim-yellow       = '#f7cf55' # base0A
dim-green        = '#8bce99' # base0B
dim-cyan         = '#00dfe5' # base0C
dim-blue         = '#92bef8' # base0D
dim-magenta      = '#aaaaec' # base0E
dim-white        = '#606a77' # base04

light-foreground = '#cadceb' # base05
light-black      = '#202833' # base03
light-red        = '#df847d' # base12
light-yellow     = '#ffe6a0' # base13
light-green      = '#a3e9b2' # base14
light-cyan       = '#8ff1f4' # base15
light-blue       = '#bad7ff' # base16
