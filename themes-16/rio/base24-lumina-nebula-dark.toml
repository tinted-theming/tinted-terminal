background     = '#0a111a' # base00
foreground     = '#cadceb' # base05
black          = '#0a111a' # base00
red            = '#d36059' # base08
yellow         = '#f7cf55' # base0A
green          = '#8bce99' # base0B
cyan           = '#00dfe5' # base0C
blue           = '#92bef8' # base0D
magenta        = '#aaaaec' # base0E
white          = '#cadceb' # base05

dim-foreground   = '#cadceb' # base05
dim-black        = '#0e1520' # base01
