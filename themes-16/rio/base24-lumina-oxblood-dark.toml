dim-yellow       = '#f9c875' # base0A
dim-green        = '#7dc797' # base0B
dim-cyan         = '#00bed0' # base0C
dim-blue         = '#96c3fb' # base0D
dim-magenta      = '#beb5fc' # base0E
dim-white        = '#79686d' # base04

light-foreground = '#e4d2d7' # base05
