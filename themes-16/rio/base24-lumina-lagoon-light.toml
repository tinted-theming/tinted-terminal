background     = '#eef9fb' # base00
foreground     = '#212829' # base05
black          = '#eef9fb' # base00
red            = '#901f1f' # base08
yellow         = '#a06200' # base0A
green          = '#007853' # base0B
cyan           = '#345a61' # base0C
blue           = '#1e69a2' # base0D
magenta        = '#5f3fa9' # base0E
