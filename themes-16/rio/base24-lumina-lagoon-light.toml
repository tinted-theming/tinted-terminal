# Rio Terminal base24 color theme (https://github.com/tinted-theming)
# Color scheme: Lumina Lagoon Light by Razik Ikhlef (https://github.com/RazikSF)

[colors]
selection-background = '#212829' # base05
selection-foreground = '#d8e8ea' # base02

cursor         = '#212829' # base05
tabs           = '#e4f3f6' # base01
