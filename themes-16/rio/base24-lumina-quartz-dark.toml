# Rio Terminal base24 color theme (https://github.com/tinted-theming)
# Color scheme: Lumina Quartz Dark by Razik Ikhlef (https://github.com/RazikSF)

[colors]
selection-background = '#cdd0d4' # base05
selection-foreground = '#28292a' # base02

cursor         = '#cdd0d4' # base05
tabs           = '#1f2021' # base01
tabs-active    = '#28292a' # base02

background     = '#1a1b1c' # base00
foreground     = '#cdd0d4' # base05
black          = '#1a1b1c' # base00
red            = '#d96e66' # base08
yellow         = '#ddbb67' # base0A
green          = '#b9daaa' # base0B
cyan           = '#95e0e8' # base0C
blue           = '#9cc2f4' # base0D
magenta        = '#b296ff' # base0E
white          = '#cdd0d4' # base05

dim-foreground   = '#cdd0d4' # base05
dim-black        = '#1f2021' # base01
dim-red          = '#d96e66' # base08
dim-yellow       = '#ddbb67' # base0A
dim-green        = '#b9daaa' # base0B
dim-cyan         = '#95e0e8' # base0C
dim-blue         = '#9cc2f4' # base0D
dim-magenta      = '#b296ff' # base0E
dim-white        = '#6b6d6e' # base04

light-foreground = '#cdd0d4' # base05
light-black      = '#323334' # base03
light-red        = '#e59189' # base12
light-yellow     = '#f9d57d' # base13
light-green      = '#cbf8b6' # base14
light-cyan       = '#acf7ff' # base15
light-blue       = '#c0dbff' # base16
light-magenta    = '#fec2f8' # base17
light-white      = '#cdd0d4' # base07
