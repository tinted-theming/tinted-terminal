# Rio Terminal base24 color theme (https://github.com/tinted-theming)
# Color scheme: Lumina Aurora Dark by Razik Ikhlef (https://github.com/RazikSF)

[colors]
selection-background = '#d9d5e3' # base05
selection-foreground = '#20192c' # base02

cursor         = '#d9d5e3' # base05
tabs           = '#171022' # base01
