# Rio Terminal base24 color theme (https://github.com/tinted-theming)
# Color scheme: Lumina Espresso Dark by Razik Ikhlef (https://github.com/RazikSF)

[colors]
selection-background = '#e5dbcd' # base05
selection-foreground = '#402b1d' # base02

cursor         = '#e5dbcd' # base05
tabs           = '#352114' # base01
tabs-active    = '#402b1d' # base02

background     = '#2f1d11' # base00
foreground     = '#e5dbcd' # base05
black          = '#2f1d11' # base00
red            = '#d47169' # base08
yellow         = '#fdcf90' # base0A
green          = '#92c79c' # base0B
cyan           = '#b7dce5' # base0C
blue           = '#92bbea' # base0D
magenta        = '#b6afe8' # base0E
white          = '#e5dbcd' # base05

dim-foreground   = '#e5dbcd' # base05
dim-black        = '#352114' # base01
dim-red          = '#d47169' # base08
dim-yellow       = '#fdcf90' # base0A
dim-green        = '#92c79c' # base0B
dim-cyan         = '#b7dce5' # base0C
dim-blue         = '#92bbea' # base0D
dim-magenta      = '#b6afe8' # base0E
dim-white        = '#866e5c' # base04

light-foreground = '#e5dbcd' # base05
light-black      = '#4b3527' # base03
light-red        = '#e1938b' # base12
light-yellow     = '#ffe3be' # base13
light-green      = '#aae1b5' # base14
light-cyan       = '#bef2ff' # base15
light-blue       = '#b0d5ff' # base16
light-magenta    = '#efadd2' # base17
light-white      = '#e5dbcd' # base07
