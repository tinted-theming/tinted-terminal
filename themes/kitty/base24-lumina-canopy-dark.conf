# Scheme name: base24 Lumina Canopy Dark
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming (https://github.com/tinted-theming/tinted-terminal)

# The basic colors
background #131d16
foreground #cddbd0
selection_background #cddbd0
selection_foreground #202c24

# Cursor colors
cursor #cddbd0
cursor_text_color #131d16

# URL underline color when hovering with mouse
url_color #617064

# Kitty window border colors
active_border_color #2a362d
inactive_border_color #17221a

# OS Window titlebar colors
wayland_titlebar_color #131d16
macos_titlebar_color #131d16

# Tab bar colors
