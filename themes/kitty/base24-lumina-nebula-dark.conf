# Scheme name: base24 Lumina Nebula Dark
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming (https://github.com/tinted-theming/tinted-terminal)

# The basic colors
background #0a111a
foreground #cadceb
selection_background #cadceb
selection_foreground #171f29

# Cursor colors
cursor #cadceb
cursor_text_color #0a111a

# URL underline color when hovering with mouse
