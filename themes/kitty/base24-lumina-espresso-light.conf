# Scheme name: base24 Lumina Espresso Light
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming (https://github.com/tinted-theming/tinted-terminal)

# The basic colors
background #fbeedf
foreground #322219
selection_background #322219
selection_foreground #e7dcd0

# Cursor colors
cursor #322219
cursor_text_color #fbeedf

# URL underline color when hovering with mouse
url_color #928270

# Kitty window border colors
active_border_color #d6ccc0
inactive_border_color #f2e8dc

# OS Window titlebar colors
wayland_titlebar_color #fbeedf
