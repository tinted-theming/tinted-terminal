# Template author: Tinted Theming (https://github.com/tinted-theming/tinted-terminal)

# The basic colors
background #1a1b1c
foreground #cdd0d4
selection_background #cdd0d4
selection_foreground #28292a

# Cursor colors
cursor #cdd0d4
