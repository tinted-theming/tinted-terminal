# Scheme name: base24 Lumina Harbor Dark
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming (https://github.com/tinted-theming/tinted-terminal)

# The basic colors
background #0c1e37
foreground #cfdceb
selection_background #cfdceb
selection_foreground #182d4a

# Cursor colors
cursor #cfdceb
cursor_text_color #0c1e37

# URL underline color when hovering with mouse
url_color #577192

# Kitty window border colors
active_border_color #223755
inactive_border_color #0e233f

# OS Window titlebar colors
wayland_titlebar_color #0c1e37
macos_titlebar_color #0c1e37

# Tab bar colors
