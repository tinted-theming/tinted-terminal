# Tinted Terminal base24 color theme (https://github.com/tinted-theming)
# Color scheme: Lumina Harbor Light by Razik Ikhlef (https://github.com/RazikSF)

name: Base24 Lumina Harbor Light
accent: "#2863ab" # base0D
cursor: "#1b2737" # base05
background: "#e6f2fe" # base00
foreground: "#1b2737" # base05
details: lighter

terminal_colors:
