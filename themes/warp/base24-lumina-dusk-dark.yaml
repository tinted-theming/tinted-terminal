# Tinted Terminal base24 color theme (https://github.com/tinted-theming)
# Color scheme: Lumina Dusk Dark by Razik Ikhlef (https://github.com/RazikSF)

name: Base24 Lumina Dusk Dark
accent: "#9ec4f7" # base0D
cursor: "#e6dee8" # base05
background: "#322434" # base00
foreground: "#e6dee8" # base05
details: darker

terminal_colors:
  normal:
    black: "#322434" # base00
    red: "#dd7168" # base08
    yellow: "#fad975" # base0A
    green: "#97d2a2" # base0B
    cyan: "#81d1da" # base0C
    blue: "#9ec4f7" # base0D
    magenta: "#969fff" # base0E
    white: "#e6dee8" # base05

  bright:
    black: "#4d3d50" # base03
    red: "#e9948c" # base12
    yellow: "#ffe69e" # base13
