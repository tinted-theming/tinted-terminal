# Tinted Terminal base24 color theme (https://github.com/tinted-theming)
# Color scheme: Lumina Rayleigh Dark by Razik Ikhlef (https://github.com/RazikSF)

name: Base24 Lumina Rayleigh Dark
accent: "#7cbdff" # base0D
cursor: "#d4dbea" # base05
