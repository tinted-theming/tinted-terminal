# Tinted Terminal base24 color theme (https://github.com/tinted-theming)
# Color scheme: Lumina Quartz Dark by Razik Ikhlef (https://github.com/RazikSF)

name: Base24 Lumina Quartz Dark
accent: "#9cc2f4" # base0D
cursor: "#cdd0d4" # base05
background: "#1a1b1c" # base00
foreground: "#cdd0d4" # base05
details: darker

terminal_colors:
  normal:
    black: "#1a1b1c" # base00
    red: "#d96e66" # base08
    yellow: "#ddbb67" # base0A
    green: "#b9daaa" # base0B
    cyan: "#95e0e8" # base0C
    blue: "#9cc2f4" # base0D
    magenta: "#b296ff" # base0E
    white: "#cdd0d4" # base05

  bright:
    black: "#323334" # base03
    red: "#e59189" # base12
    yellow: "#f9d57d" # base13
    green: "#cbf8b6" # base14
    cyan: "#acf7ff" # base15
    blue: "#c0dbff" # base16
    magenta: "#fec2f8" # base17
    white: "#cdd0d4" # base07
