# Tinted Terminal base24 color theme (https://github.com/tinted-theming)
# Color scheme: Lumina Harbor Dark by Razik Ikhlef (https://github.com/RazikSF)

name: Base24 Lumina Harbor Dark
accent: "#87c6f2" # base0D
cursor: "#cfdceb" # base05
background: "#0c1e37" # base00
foreground: "#cfdceb" # base05
details: darker

terminal_colors:
  normal:
    black: "#0c1e37" # base00
    red: "#dd6b62" # base08
    yellow: "#e8d66b" # base0A
    green: "#82d9b4" # base0B
    cyan: "#bedee4" # base0C
    blue: "#87c6f2" # base0D
    magenta: "#b897f0" # base0E
    white: "#cfdceb" # base05

  bright:
    black: "#223755" # base03
    red: "#e88f86" # base12
    yellow: "#fbea87" # base13
    green: "#a1f2ce" # base14
    cyan: "#b8f4ff" # base15
    blue: "#b1deff" # base16
    magenta: "#ffc5f8" # base17
    white: "#cfdceb" # base07
