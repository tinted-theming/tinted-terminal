# Tinted Terminal base24 color theme (https://github.com/tinted-theming)
# Color scheme: Lumina Cherenkov Light by Razik Ikhlef (https://github.com/RazikSF)

name: Base24 Lumina Cherenkov Light
accent: "#2c516b" # base0D
cursor: "#1e2735" # base05
background: "#f2f8fc" # base00
foreground: "#1e2735" # base05
details: lighter

terminal_colors:
  normal:
    black: "#f2f8fc" # base00
    red: "#cb3f3c" # base08
    yellow: "#a35f00" # base0A
    green: "#4a7d26" # base0B
    cyan: "#00697b" # base0C
    blue: "#2c516b" # base0D
    magenta: "#4433aa" # base0E
    white: "#1e2735" # base05

  bright:
    black: "#ced6db" # base03
    red: "#9e423d" # base12
    yellow: "#874e00" # base13
    green: "#3b671b" # base14
    cyan: "#005462" # base15
    blue: "#003e60" # base16
    magenta: "#6d347a" # base17
    white: "#1e2735" # base07
