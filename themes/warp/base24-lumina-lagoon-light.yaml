# Tinted Terminal base24 color theme (https://github.com/tinted-theming)
# Color scheme: Lumina Lagoon Light by Razik Ikhlef (https://github.com/RazikSF)

name: Base24 Lumina Lagoon Light
accent: "#1e69a2" # base0D
cursor: "#212829" # base05
background: "#eef9fb" # base00
foreground: "#212829" # base05
details: lighter

terminal_colors:
  normal:
    black: "#eef9fb" # base00
    red: "#901f1f" # base08
    yellow: "#a06200" # base0A
    green: "#007853" # base0B
