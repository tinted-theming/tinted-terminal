    blue: "#1e69a2" # base0D
    magenta: "#5f3fa9" # base0E
    white: "#212829" # base05

  bright:
    black: "#c8d7da" # base03
    red: "#69221e" # base12
    yellow: "#855100" # base13
    green: "#006143" # base14
