# Tinted Terminal base24 color theme (https://github.com/tinted-theming)
# Color scheme: Lumina Olive Light by Razik Ikhlef (https://github.com/RazikSF)

name: Base24 Lumina Olive Light
accent: "#2e5ba6" # base0D
cursor: "#262816" # base05
background: "#f1f0d9" # base00
foreground: "#262816" # base05
details: lighter

terminal_colors:
